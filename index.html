<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={home:'m3 10 9-7 9 7 M5 9v12h5v-7h4v7h5V9',train:'M3 8v8 M6 5v14 M6 12h12 M18 5v14 M21 8v8',log:'M12 3v18 M3 12h18',chart:'M4 19V5 M4 19h17 M8 15l4-5 4 2 5-7',arrow:'m9 5 7 7-7 7',bolt:'m14 2-9 12h6l-1 8 9-13h-6Z',shield:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z M8 12l3 3 5-6',run:'M13 5a2 2 0 1 0 0-4 2 2 0 0 0 0 4 M8 22l3-8-3-3 3-5 4 4 5 1 M2 15l5 2 2-4 M13 14l4 3v5',camera:'M8 5l2-2h4l2 2h5v15H3V5Z M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',check:'m5 12 4 4L20 5',trash:'M4 7h16 M9 7V3h6v4 M6 7l1 14h10l1-14 M10 10v8 M14 10v8',book:'M12 5c-3-2-7-2-10-1v16c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1v16',moon:'M20 15A9 9 0 0 1 9 3a9 9 0 1 0 11 12',target:'M21 12a9 9 0 1 1-9-9 M17 12a5 5 0 1 1-5-5 M12 12l9-9 M16 3h5v5',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 7v6l4 2'};
const ico=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.bolt}"/></svg>`;
const fresh=()=>({version:1,p:{name:'Sultan',age:'',weight:'',height:'',experience:'unknown',days:3,minutes:30,focus:'hybrid',pain:'unknown',zoneLow:'',zoneHigh:'',zonesMethod:'',ready:false},logs:[],custom:[],goals:[],runGoal:{pace:300,distance:5,zonePct:90},active:null});
let S=fresh(),tab='home',trainingTab='suggested',logTab='quick',progressTab='stats',photoData='',toastTimer,timerEnd=0,timerInterval;
try{const stored=JSON.parse(localStorage.getItem('arise-v1')||'null');if(stored&&stored.version===1)S={...fresh(),...stored,p:{...fresh().p,...stored.p},runGoal:{...fresh().runGoal,...stored.runGoal}}}catch{}
function persist(){try{localStorage.setItem('arise-v1',JSON.stringify(S));$('storage-note').style.display='none';return true}catch{$('storage-note').style.display='block';return false}}
const day=(date=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
function dateLabel(d){return new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function weekDays(){const today=day(),d=new Date(today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setUTCDate(d.getUTCDate()+i);return x.toISOString().slice(0,10)})}
const weekly=()=>S.logs.filter(l=>weekDays().includes(l.date)&&l.kind!=='recovery');
function xp(){const days={};S.logs.forEach(l=>{days[l.date]=Math.max(days[l.date]||0,l.kind==='recovery'?30:100)});return Object.values(days).reduce((a,b)=>a+b,0)}
const level=()=>1+Math.floor(xp()/300),rank=()=>level()>=50?'S':level()>=35?'A':level()>=20?'B':level()>=10?'C':level()>=5?'D':'E';
function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4200)}
function modal(title,body,footer=''){$('overlay').innerHTML=`<div class="modal-back"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="close" onclick="closeModal()" aria-label="Close dialog">×</button></header>${body}${footer?`<footer>${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>$('overlay').querySelector('button,input,select,textarea')?.focus(),0)}
function closeModal(){$('overlay').innerHTML='';document.body.style.overflow='';$('app').focus?.()}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.querySelector('.nav').innerHTML=[['home','home','Today'],['train','train','Train'],['log','log','Log'],['progress','chart','Progress']].map(([t,i,n])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')" ${tab===t?'aria-current="page"':''}>${ico(i)}${n}</button>`).join('');$('avatar').textContent=(S.p.name||'S')[0].toUpperCase();$('app').innerHTML=`<div class="page">${tab==='home'?home():tab==='train'?train():tab==='log'?logging():progress()}</div>`}
function heading(chapter,title,sub){return `<div class="greeting"><div class="eyebrow">${chapter}</div><h1 style="margin-top:8px">${title}</h1><p>${sub}</p></div>`}
function weekWidget(){const done=new Set(weekly().map(l=>l.date));return `<div class="week">${weekDays().map((d,i)=>`<div class="day ${done.has(d)?'done':''} ${d===day()?'now':''}">${['M','T','W','T','F','S','S'][i]}<span>${done.has(d)?'✓':Number(d.slice(-2))}</span></div>`).join('')}</div>`}
function home(){const b=benchmarkCoverage(),count=new Set(weekly().map(l=>l.date)).size;return heading('Chapter 01 / Awakening',`Your next level, ${esc(S.p.name)}.`,b===8?'Build on what you measured. One session at a time.':'Train today. Assess whenever you’re ready.')+`<section class="hero"><div class="hero-layout"><div><div class="eyebrow">THE SYSTEM • ${rank()} RANK</div><h2 class="hero-title">Small quests.<br>Real progress.</h2><p>${xp()?'You earned your progress by showing up.':'The first quest is to find your starting point.'}</p></div><div class="level-ring" style="--angle:${xp()%300/300*360}deg"><div class="level-inner"><small>HUNTER LEVEL</small><b>${level()}</b><small>${xp()?'KEEP BUILDING':'AWAKENING'}</small></div></div></div><div class="xpbar"><div class="row between small"><span>${xp()%300} / 300 XP</span><span class="muted">Level ${level()+1}</span></div><div class="meter"><span style="width:${xp()%300/3}%"></span></div></div></section><div class="stat-strip"><div class="stat"><b>${count}<span class="muted" style="font-size:15px"> / ${S.p.days}</span></b><small>days this week</small></div><div class="stat"><b>${b}<span class="muted" style="font-size:15px"> / 8</span></b><small>baseline patterns</small></div><div class="stat"><b>${Math.round(S.logs.filter(l=>l.kind!=='recovery').reduce((a,l)=>a+Number(l.minutes||0),0))}</b><small>minutes logged</small></div></div><div class="intro-grid"><div class="stack"><div class="section-head"><h2>Next quest</h2><span class="badge">${b<8?'TRAINING':'TRAINING'}</span></div><section class="card quest"><div class="quest-icon">${ico(b<8?'shield':'train')}</div><div><div class="eyebrow">${b<8?'YOUR NEXT SESSION':'YOUR HOME GYM'}</div><h3>A plan you can repeat</h3><p>Start training now. Assessment is optional.</p></div><button class="btn" onclick="trainingTab='suggested';go('train')">View workouts ${ico('arrow')}</button></section><section class="card"><div class="row between"><h3>Your week</h3><span class="small muted">No streak penalties</span></div>${weekWidget()}<div class="divider"></div><div class="row between"><p class="small">Rest is part of the plan.</p><button class="link" onclick="restCheck()">Log recovery +30 XP</button></div></section><section class="card subtle"><div class="row" style="align-items:flex-start"><div class="mint">${ico('camera')}</div><div><h3 style="margin-bottom:6px">Garmin → your log</h3><p class="small">Add a screenshot, paste its Live Text, and confirm the numbers.</p><button class="link" onclick="logTab='garmin';go('log')">Log from a screenshot →</button></div></div></section></div><div class="stack"><section class="card"><div class="row between"><h3>Player status</h3><span class="badge ${b===8?'green':'amber'}">${b===8?'BASELINED':'UNASSESSED'}</span></div><div class="divider"></div><div class="bodymap"><svg viewBox="0 0 100 190" aria-hidden="true"><g fill="#252033" stroke="#8871b0" stroke-width="1.3"><circle cx="50" cy="18" r="12"/><path d="m35 36-17 9-9 43 10 3 13-33 2 37-7 76 13 2 10-64 10 64 13-2-7-76 2-37 13 33 10-3-9-43-17-9-15 6Z"/></g><path d="M36 52h28 M50 43v49 M35 73h30 M36 94h28" stroke="#a58aff" stroke-width="2" opacity=".6"/></svg><div><div class="eyebrow">YOUR CURRENT CHAPTER</div><h3 style="margin:7px 0">${b===0?'Discover your baseline':b<8?'Finish the assessment':'Build your foundation'}</h3><p class="small">${b<8?'Fitness level is unknown until you log results. Your game level measures consistency.':'Your progress is compared with your own starting results, using the same exercise setup.'}</p><button class="link" onclick="go('progress')">View stats →</button></div></div></section><section class="card"><div class="eyebrow">COACH NOTE / 01</div><h3 style="margin:10px 0 7px">Leave two good reps.</h3><p class="small">Finish most sets when you could still do 2–3 clean repetitions. Losing form ends the set. More exhaustion does not automatically mean more progress.</p><button class="link" onclick="research()">Training tips & evidence →</button></section>${!S.p.ready?`<button class="btn secondary full" onclick="profile()">${ico('shield')} Complete your training profile</button>`:`<div class="note">${S.p.days} days · ${S.p.minutes} minutes · ${esc(S.p.focus)} focus. <button class="link" onclick="profile()">Adjust profile</button></div>`}</div></div>`}
const E={
 push:{name:'Incline push-up',pattern:'Push',muscles:'Chest · triceps · front shoulders',unit:'reps',variation:'Hands on secured bench',target:'6–12 reps',tips:['Brace the bench against movement; use a wall instead if it shifts.','Keep ribs, hips and head in one line; lower under control.','Choose a height that leaves 2–3 clean reps. Note the hand height.']},

const assessed=['push','row','press','squat','hinge','core','calf','run'];
function records(id){return S.logs.filter(l=>l.kind!=='recovery').flatMap(l=>(l.sets||[]).filter(s=>s.id===id&&s.done).map(s=>({...s,date:l.date,logId:l.id}))).sort((a,b)=>a.date.localeCompare(b.date))}
function benchmarkCoverage(){return assessed.filter(id=>id==='run'?S.logs.some(l=>l.benchmark==='run'&&l.kind==='run'&&l.distance>0):S.logs.some(l=>l.benchmark&&(l.sets||[]).some(s=>s.id===id&&s.done))).length}
function plan(){const base=[['a','Foundation A','Full body · home equipment'],['easy','Easy run / walk','Conversation pace · no pace target'],['b','Foundation B','Full body · controlled reps'],['easy','Easy run / walk','Repeatable, comfortable effort'],[S.p.focus==='running'?'easy':'flow',S.p.focus==='running'?'Easy run / walk':'Simple conditioning',S.p.focus==='running'?'A third comfortable run if recovered':'Optional · familiar movements only']];return Number(S.p.days)===2?[base[0],base[2]]:base.slice(0,Number(S.p.days))}
function templateCard(id,title,desc,meta,action){return `<section class="card"><div class="row between"><span class="badge">${meta}</span>${ico(id==='easy'||id==='run'?'run':'train')}</div><h3 style="margin:14px 0 6px">${esc(title)}</h3><p class="small">${desc}</p><button class="btn secondary full" style="margin-top:18px" onclick="${action}">${id==='run'||id==='easy'?'Open run logger':'Start session'} ${ico('arrow')}</button></section>`}
function train(){if(S.active)return session();return heading('Chapter 01 / Training','Choose your quest.','Simple movements. Clear targets. Your pace.')+`<div class="tabs">${[['suggested','For you'],['assess','First assessment'],['custom','My workouts']].map(([k,n])=>`<button class="${trainingTab===k?'on':''}" onclick="trainingTab='${k}';render()">${n}</button>`).join('')}</div>${trainingTab==='assess'?assessment():trainingTab==='custom'?customs():`<div class="note">${S.p.ready?`${S.p.days} sessions per week · up to ${S.p.minutes} min each.`:'Draft plan until your profile is complete.'} Two strength sessions, with at least a day between them. Start easy; add work only when recovered.</div><div class="spacer"></div><div class="grid">${plan().map(([id,n,d])=>templateCard(id,n,d,`${id==='flow'?Math.min(20,S.p.minutes):S.p.minutes} MIN`,id==='easy'?"openRun(false)":`start('${id}')`)).join('')}</div><div class="section-head"><h2>Equipment rules</h2></div><section class="card"><p class="small">Your 20 kg bar + paired 10 kg and 20 kg plates gives <b>20 / 40 / 60 / 80 kg total</b>. No dumbbells or cardio machines are assumed. Your bench, rack, pull-up station and bands cover the starter plan.</p><div class="divider"></div><p class="small">Do not jump 20 kg to progress. Add controlled reps first. Small plates (pairs of 1.25 kg or 2.5 kg) would allow sensible load increases later. Barbell moves are optional, and require familiar form plus safety arms for squats and bench presses.</p></section><button class="link" onclick="research()">Read all coaching tips →</button>`}`}
function assessment(){return `<section class="card"><div class="row between"><span class="badge amber">STARTING LEVEL: UNASSESSED</span><span class="small muted">${benchmarkCoverage()} / 8 measured</span></div><h2 style="margin:14px 0 9px">Measure. Don’t max out.</h2><p class="small">This is a submaximal starting assessment of movement patterns, not a test of every muscle’s maximum or an athletic ranking. Do the upper and lower sessions on different days, with 24–48 hours between them. Do the run on a fresh day.</p><div class="divider"></div><p class="small">Warm up for 5–8 minutes: easy walking, gentle movement, then a few easy practice reps of each exercise. Do one controlled test set per movement, leaving 2–3 good reps available (RIR). Rest 2 minutes between movements. Skip anything unfamiliar or painful. Retest after 4–6 weeks in the same setup.</p></section><div class="spacer"></div><div class="grid">${templateCard('upper','01 · Upper body & core','Incline push-up, band row, band press, and a short plank. Record bench height, band and grip.','20–25 MIN',"start('upper')")}${templateCard('lower','02 · Lower body','Chair squat, glute bridge, supported calf raise. No loaded squat or deadlift test.','20 MIN',"start('lower')")}${templateCard('run','03 · Aerobic baseline','5 min walk → 15 min comfortable run/walk → 5 min walk. Log the middle 15-minute segment separately.','25 MIN TOTAL',"openRun(true)")}</div><div class="spacer"></div><div class="note warn">Stop for sharp pain, dizziness, chest pain, or unusual breathlessness. Chest pain or fainting needs urgent medical attention. A text cue cannot check your form; get an in-person check before unfamiliar loaded lifts.</div>`}
function customs(){return `<button class="btn full" onclick="builder()">${ico('log')} Create a workout</button><div class="spacer"></div>${S.custom.length?`<div class="grid">${S.custom.map(c=>`<section class="card"><span class="badge">CUSTOM / ${c.moves.length} MOVES</span><h3 style="margin:12px 0">${esc(c.name)}</h3><p class="small">${c.moves.map(id=>esc(E[id]?.name||id)).join(' · ')}</p><div class="row" style="margin-top:18px"><button class="btn secondary" onclick="startCustom('${c.id}')">Start</button><button class="link" onclick="deleteCustom('${c.id}')">Delete</button></div></section>`).join('')}</div>`:`<div class="card empty">${ico('train')}<h3>Your routine, your rules.</h3><p>Build from familiar movements. You can also log any gym or CrossFit session under Log.</p></div>`}`}
function builder(){modal('Create a workout',`<label for="custom-name">Workout name</label><input id="custom-name" maxlength="60" placeholder="My home session"><label>Choose familiar movements</label><div class="listgap">${Object.entries(E).map(([id,e])=>`<label class="check"><input type="checkbox" name="moves" value="${id}"><span>${e.name}<br><small class="muted">${e.muscles}${e.bar?' · safety arms required':''}</small></span></label>`).join('')}</div><p class="tagline">Sets, reps and variations can be adjusted during the session. Any unfamiliar exercise should wait for a form check.</p>`,`<button class="btn full" onclick="saveCustom()">Save workout</button>`)}
function saveCustom(){const name=$('custom-name').value.trim(),moves=[...document.querySelectorAll('input[name=moves]:checked')].map(e=>e.value);if(!name||!moves.length)return toast('Add a name and at least one movement.');S.custom.push({id:crypto.randomUUID(),name,moves});persist();closeModal();render();toast('Workout created.')}
function deleteCustom(id){if(!confirm('Delete this workout template? Your logged sessions stay.'))return;S.custom=S.custom.filter(c=>c.id!==id);persist();render()}
function startCustom(id){const c=S.custom.find(c=>c.id===id);if(c)start('custom',c)}
function ready(){return S.p.ready&&Number(S.p.age)>=18&&S.p.pain==='no'&&S.p.experience!=='unknown'}
function start(id,custom){if(!ready()){profile();toast('Complete the safety and experience fields first.');return}const moves=custom?custom.moves:({upper:['push','row','press','core'],lower:['squat','hinge','calf'],a:['squat','push','row','hinge','core','calf'],b:['split','press','row','hinge','core','calf'],flow:['squat','push','row']}[id]);const title=custom?custom.name:({upper:'Upper body assessment',lower:'Lower body assessment',a:'Foundation A',b:'Foundation B',flow:'Simple conditioning'}[id]);const isAssessment=['upper','lower'].includes(id),bar=moves.some(k=>E[k].bar),recent=S.logs.filter(l=>l.sets?.length&&l.kind==='strength').some(l=>(new Date(day()+'T12:00Z')-new Date(l.date+'T12:00Z'))/86400000<2);modal('Before you begin',`<p class="small">${esc(title)} · ${isAssessment?'1 controlled test set per move':'Start with 1–2 sets per move; build only when recovered'}. Keep 2–3 reps in reserve. Rest 90–120 seconds between sets; longer if you need it.</p>${recent?'<div class="spacer"></div><div class="note warn">You logged strength work within the last 48 hours. If the same muscles are sore or your performance feels reduced, choose an easy walk or recovery instead.</div>':''}${id==='flow'?'<div class="spacer"></div><div class="note">8-minute technique circuit after warming up: alternate 5 chair squats, 5 incline push-ups, 8 band rows. Rest freely. No speed score, failure, Olympic lifts, or kipping.</div>':''}<label class="check"><input id="familiar" type="checkbox"><span>I know these movements, can do them without pain, and will warm up first. I will skip a move if I cannot control it.</span></label>${bar?'<label class="check"><input id="safeties" type="checkbox"><span>I have established barbell technique and have correctly set safety arms for bench presses and squats.</span></label>':''}`,`<button class="btn full" id="begin-confirm">Begin session</button>`);$('begin-confirm').onclick=()=>{if(!$('familiar').checked||(bar&&!$('safeties').checked))return toast('Confirm the checks or choose a simpler workout.');const setCount=isAssessment||S.p.minutes<=20?1:S.p.experience==='regular'&&S.p.focus==='muscle'&&S.p.minutes>=45?3:2;S.active={id:crypto.randomUUID(),type:id,title,start:Date.now(),date:day(),assessment:isAssessment,notes:'',sets:moves.flatMap(k=>Array.from({length:setCount},()=>({id:k,variation:E[k].variation,weight:E[k].bar?20:0,reps:'',rir:'',done:false})))};persist();closeModal();tab='train';render()}}
function lastPerformance(id){const r=records(id),last=r[r.length-1];return last?`<p class="inline-tip">Last recorded: ${last.reps} ${E[id].unit}, ${last.weight} kg added, ${last.rir} RIR. Repeat that only if the variation matches and you feel recovered.</p>`:''}
function session(){const a=S.active,moves=[...new Set(a.sets.map(s=>s.id))];return heading(a.assessment?'Chapter 01 / Assessment':'Chapter 02 / Training',esc(a.title),'Record what you actually do. An unfinished set earns no XP.')+`<section class="card"><div class="row between"><span class="badge">${a.sets.filter(s=>s.done).length} / ${a.sets.length} SETS LOGGED</span><button class="link" onclick="discard()">Discard draft</button></div><div class="timer"><div><small class="muted">REST TIMER</small><br><b id="time-display">${remainingTime()}</b></div><div><button onclick="restTimer(90)">90 sec</button><button onclick="restTimer(120)">2 min</button><button onclick="restTimer(0)">Reset</button></div></div><div class="note">${a.assessment?'One controlled set per movement. Cap reps at 12; plank at 30 sec.':'Do fewer sets if short on time. Work steadily; do not race the timer.'} RIR means clean repetitions you could still perform.</div>${moves.map(id=>`<div class="exercise"><h3>${esc(E[id].name)}</h3><p>${E[id].muscles} · ${E[id].target}</p>${lastPerformance(id)}<details><summary>Form cues & setup</summary><ul>${E[id].tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details><label>Repeatable variation / setup</label><input aria-label="${esc(E[id].name)} variation" maxlength="160" value="${esc(a.sets.find(s=>s.id===id).variation)}" onchange="variation('${id}',this.value)"><div class="setgrid"><small>SET</small><small>${E[id].bar?'KG TOTAL':'KG ADDED'}</small><small>${E[id].unit.toUpperCase()}</small><small>RIR ${E[id].unit==='sec'?'*':''}</small><small>LOG</small></div>${a.sets.map((s,i)=>s.id!==id?'':`<div class="setgrid ${s.done?'savedset':''}"><span class="setnum">${a.sets.slice(0,i+1).filter(x=>x.id===id).length}</span><input id="weight-${i}" aria-label="${esc(E[id].name)} kg" type="number" min="0" max="500" step="0.5" value="${s.weight}" onchange="draftSet(${i},'weight',this.value)" ${s.done?'disabled':''}><input id="reps-${i}" aria-label="${esc(E[id].name)} ${E[id].unit}" type="number" min="1" max="999" placeholder="—" value="${s.reps}" onchange="draftSet(${i},'reps',this.value)" ${s.done?'disabled':''}><input id="rir-${i}" aria-label="${esc(E[id].name)} reps in reserve" type="number" min="0" max="10" placeholder="2" value="${s.rir}" onchange="draftSet(${i},'rir',this.value)" ${s.done?'disabled':''}><button class="btn ${s.done?'secondary':''}" aria-label="${s.done?'Unlock':'Save'} set ${i+1}" onclick="saveSet(${i})">${s.done?'✓':'+'}</button></div>`).join('')}<button class="link" onclick="addSet('${id}')">+ Add set</button>${id==='core'?'<p class="inline-tip">* For plank, use RIR 2 as a shorthand for stopping with form and breathing still controlled; it is not a literal rep estimate.</p>':''}</div>`).join('')}<label for="session-notes">Session notes</label><textarea id="session-notes" maxlength="1000" placeholder="What felt good? What needs attention?" onchange="S.active.notes=this.value;persist()">${esc(a.notes)}</textarea><div class="fieldrow"><div><label for="session-date">Session date</label><input id="session-date" type="date" max="${day()}" value="${a.date}"></div><div><label for="session-duration">Total session minutes</label><input id="session-duration" type="number" min="1" max="600" placeholder="Actual minutes"></div></div><button class="btn full" style="margin-top:20px" onclick="finish()">Finish & save workout</button><p class="tagline">Only saved sets enter your history. Partial workouts are welcome. Your draft is kept on this browser when storage is available.</p></section>`}
function draftSet(i,k,v){if(S.active&&!S.active.sets[i].done){S.active.sets[i][k]=v;persist()}}
function variation(id,v){S.active.sets.filter(s=>s.id===id).forEach(s=>s.variation=v.trim());persist()}
function addSet(id){S.active.sets.push({...S.active.sets.find(s=>s.id===id),reps:'',rir:'',done:false});persist();render()}
function saveSet(i){const s=S.active.sets[i],e=E[s.id];if(s.done){s.done=false;persist();render();return}const w=Number($('weight-'+i).value),r=Number($('reps-'+i).value),rir=Number($('rir-'+i).value);if(!Number.isFinite(w)||w<0||w>500||!Number.isInteger(r)||r<1||r>999||$('rir-'+i).value===''||!Number.isInteger(rir)||rir<0||rir>10)return toast('Enter valid kg, reps/seconds, and RIR (0–10).');if(e.bar&&![20,40,60,80].includes(w))return toast('Your home bar supports totals of 20, 40, 60 or 80 kg.');if(S.active.assessment&&(rir<2||r>(e.unit==='sec'?30:12)))return toast('Assessment: stop at 12 reps / 30 seconds, with at least 2 RIR. Log harder sets as regular workouts.');if(!s.variation.trim())return toast('Describe the variation so you can compare it later.');Object.assign(s,{weight:w,reps:r,rir,done:true});persist();render();if(!S.active.assessment)restTimer(90)}
function remainingTime(){const sec=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function restTimer(sec){clearInterval(timerInterval);timerEnd=sec?Date.now()+sec*1000:0;const update=()=>{if($('time-display'))$('time-display').textContent=remainingTime();if(timerEnd&&Date.now()>=timerEnd){clearInterval(timerInterval);timerEnd=0;toast('Rest complete. Start when your breathing is ready.')}};update();if(sec)timerInterval=setInterval(update,500)}
function discard(){if(!confirm('Discard this session draft?'))return;S.active=null;persist();render()}
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d+'T12:00Z').getTime())&&d<=day()}
function finish(){const a=S.active,sets=a.sets.filter(s=>s.done),date=$('session-date').value,minutes=Number($('session-duration').value);if(!sets.length)return toast('Save at least one completed set.');if(!validDate(date)||minutes<1||minutes>600)return toast('Enter a past/current date and 1–600 actual minutes.');const log={id:a.id,date,kind:'strength',title:a.title,minutes,sets:structuredClone(sets),notes:$('session-notes').value,benchmark:a.assessment?a.type:null};S.logs.push(log);S.active=null;persist();restTimer(0);go('progress');toast('Workout saved. XP is capped at 100 per day.')}
function restCheck(){if(S.logs.some(l=>l.date===day()&&l.kind==='recovery'))return toast('Recovery already logged today. No extra task needed.');modal('Recovery is a quest, too.',`<p>Take a rest day, an easy walk or a few minutes of comfortable movement. There is no missed-day penalty.</p><label for="rest-note">Optional note</label><input id="rest-note" maxlength="250" placeholder="How are you feeling?">`,`<button class="btn full" onclick="saveRest()">Log recovery day</button>`)}
function saveRest(){S.logs.push({id:crypto.randomUUID(),date:day(),kind:'recovery',title:'Recovery day',minutes:0,notes:$('rest-note').value});persist();closeModal();render();toast('Recovery logged. Rest supports the next session.')}
function logging(){return heading('Chapter 01 / Field log','Less admin. More training.','Log a run, a gym session, or a Garmin screenshot.')+`<div class="tabs">${[['quick','Quick log'],['garmin','Garmin screenshot'],['history','History']].map(([k,n])=>`<button class="${logTab===k?'on':''}" onclick="logTab='${k}';render()">${n}</button>`).join('')}</div>${logTab==='history'?history():logTab==='garmin'?garmin():quickForm(false,false)}`}
function quickForm(runOnly=false,benchmark=false,screenshot=false){return `<section class="card"><div class="row between"><h3>${benchmark?'15-minute aerobic baseline':runOnly?'Log your run':'What did you do?'}</h3><span class="badge">${benchmark?'ASSESSMENT':'ACTUAL RESULTS'}</span></div>${benchmark?'<p class="tagline">Warm up with a 5-minute walk. Record only the middle 15-minute easy segment below, then cool down. Run/walk is fine. Keep conversation possible; no pace or max-HR test.</p>':''}<form id="quick-form" data-screenshot="${screenshot}" onsubmit="event.preventDefault();saveQuick(${benchmark})"><label for="kind">Activity</label><select id="kind" onchange="kindChanged()">${(runOnly?['run']:['run','strength','conditioning','walk']).map(k=>`<option value="${k}">${{run:'Run / run-walk',strength:'Gym / strength',conditioning:'CrossFit / conditioning',walk:'Walk'}[k]}</option>`).join('')}</select><div class="fieldrow"><div><label for="log-date">Date</label><input required id="log-date" type="date" max="${day()}" value="${day()}"></div><div><label for="duration">Elapsed time (mm:ss)</label><input required id="duration" inputmode="numeric" pattern="[0-9]{1,3}:[0-5][0-9]" placeholder="30:00" value="${benchmark?'15:00':''}"></div></div><div id="run-fields"><div class="fieldrow"><div><label for="distance">Distance (km)</label><input id="distance" type="number" min="0.01" max="300" step="0.01" placeholder="5.00" required></div><div><label for="hr">Average HR (bpm, optional)</label><input id="hr" type="number" min="30" max="240" placeholder="From Garmin"></div></div><div class="fieldrow"><div><label for="zonepct">Time in Zone 3 (%, optional)</label><input id="zonepct" type="number" min="0" max="100" step="0.1" placeholder="From time-in-zones"></div><div><label for="rpe">Effort / 10</label><select id="rpe"><option value="">Not recorded</option>${Array.from({length:10},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div></div><label for="conditions">Conditions / route</label><input id="conditions" maxlength="160" placeholder="Flat route, heat, treadmill incline…"><label class="check"><input type="checkbox" id="continuous"><span>Continuous run, no stopped breaks; duration is elapsed time. Check only if true.</span></label><p class="tagline">Average HR alone does not verify time in zone. Leave unknown values blank.</p></div><div id="other-fields" hidden><label for="activity-name">Session name</label><input id="activity-name" maxlength="80" placeholder="Gym upper body / my WOD"><label for="details">Exercises / sets / loads</label><textarea id="details" maxlength="2000" placeholder="Bench: 3 × 8 at 40 kg, 2 RIR. Write actual results."></textarea><p class="tagline">Use Train for structured per-set tracking and baseline comparisons. This is a session summary.</p></div><label for="log-notes">Notes (optional)</label><textarea id="log-notes" maxlength="1000" placeholder="How did it feel? Any changes to the plan?"></textarea><button class="btn full" type="submit" style="margin-top:18px">Save ${benchmark?'baseline':'workout'}</button></form></section>`}
function kindChanged(){const isRun=$('kind').value==='run';$('run-fields').hidden=!isRun;$('other-fields').hidden=isRun;$('distance').required=isRun}
function parseTime(s){if(!/^\d{1,3}:[0-5]\d$/.test(s))return NaN;const [m,sec]=s.split(':').map(Number);return m*60+sec}
function paceText(sec){if(!Number.isFinite(sec))return '—';let n=Math.round(sec);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function optionalNum(id){return $(id)?.value.trim()===''?null:Number($(id)?.value)}
function saveQuick(benchmark){const date=$('log-date').value,sec=parseTime($('duration').value),kind=$('kind').value,isRun=kind==='run',distance=Number($('distance').value),hr=optionalNum('hr'),zonePct=optionalNum('zonepct');if(!validDate(date)||!Number.isFinite(sec)||sec<30||sec>36000)return toast('Enter a valid date and elapsed time (mm:ss, 30 seconds–10 hours).');if(benchmark&&sec!==900)return toast('Baseline uses exactly the middle 15:00 segment. Use a regular log for other durations.');if(isRun&&(!Number.isFinite(distance)||distance<=0||distance>300))return toast('Enter the recorded distance in km.');if(isRun&&((hr!==null&&(!Number.isFinite(hr)||hr<30||hr>240))||(zonePct!==null&&(!Number.isFinite(zonePct)||zonePct<0||zonePct>100))))return toast('Check heart rate and Zone 3 percentage.');if(!isRun&&!$('activity-name').value.trim())return toast('Give the session a name.');const signature=kind+'|'+date+'|'+sec+'|'+(isRun?distance:$('activity-name').value.trim());if(S.logs.some(l=>l.signature===signature)&&!confirm('A matching session already exists. Save another?'))return;const log={id:crypto.randomUUID(),date,kind,title:isRun?(benchmark?'Aerobic baseline':'Run'):$('activity-name').value.trim(),minutes:sec/60,seconds:sec,notes:$('log-notes').value,signature,benchmark:benchmark?'run':null};if(isRun)Object.assign(log,{distance,hr,zonePct,rpe:optionalNum('rpe'),pace:sec/distance,continuous:$('continuous').checked,conditions:$('conditions').value,zoneLow:Number(S.p.zoneLow)||null,zoneHigh:Number(S.p.zoneHigh)||null,zonesMethod:S.p.zonesMethod});else log.details=$('details').value;if(photoData&&$('quick-form').dataset.screenshot==='true'){log.image=photoData;log.source='Garmin screenshot + user-confirmed data'}S.logs.push(log);photoData='';persist();closeModal();go('progress');toast('Session saved. Review results in your history.')}
function openRun(benchmark){if(!ready()){profile();toast('Complete your training profile first.');return}modal(benchmark?'Aerobic assessment':'Run logger',quickForm(true,benchmark))}
function garmin(){return `<section class="card"><div class="row between"><h3>Screenshot → confirmed log</h3>${ico('camera')}</div><p class="tagline">This version uses your iPhone’s Live Text, not automatic image recognition or a Garmin connection. Nothing is uploaded to a server by this app.</p><label for="screenfile">1. Add Garmin screenshot (optional)</label><input id="screenfile" type="file" accept="image/*" onchange="loadPhoto(this.files[0])"><div id="photo-preview">${photoData?`<img class="screenimage" src="${photoData}" alt="Your Garmin screenshot">`:''}</div><label for="garmintext">2. Paste copied text</label><textarea id="garmintext" style="min-height:130px" placeholder="Distance&#10;5.01 km&#10;Total Time&#10;30:12&#10;Avg HR&#10;145 bpm"></textarea><p class="tagline">In Photos, open the screenshot → use Live Text to select/copy the stats → paste here. English labels and km/mi are supported. You can also enter the stats yourself.</p><div class="row wrap" style="margin-top:15px"><button class="btn" onclick="parseGarmin()">Parse pasted text</button><button class="btn ghost" onclick="showGarminReview()">Enter manually</button></div><div id="parse-report" class="tagline"></div></section><div id="garmin-review" style="margin-top:18px"></div>`}
async function loadPhoto(file){if(!file)return;if(!file.type.startsWith('image/')||file.size>15000000)return toast('Choose an image under 15 MB.');try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const image=new Image();image.src=data;await image.decode();const scale=Math.min(1,1100/image.width,1800/image.height),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);photoData=canvas.toDataURL('image/jpeg',.7);$('photo-preview').innerHTML=`<img class="screenimage" src="${photoData}" alt="Garmin screenshot for your review"><button class="link" onclick="photoData='';$('photo-preview').innerHTML=''">Remove image</button>`;toast('Image added. Paste Live Text or enter the numbers below.')}catch{toast('This image could not be opened. Try a PNG or JPEG screenshot.')}}
function showGarminReview(){$('garmin-review').innerHTML=quickForm(false,false,true);$('parse-report').textContent='3. Confirm activity, date, duration, units and every parsed value before saving. Screenshot date is not inferred.'}
function parseGarmin(){const t=$('garmintext').value.replace(/\u00a0/g,' ').replace(/,/g,'.');if(!t.trim())return toast('Paste the text copied from your screenshot.');showGarminReview();let found=[];const dist=t.match(/(?:distance\s*[:\-]?\s*)?(\d+(?:\.\d+)?)\s*(km|mi)\b/i);if(dist){$('distance').value=(Number(dist[1])*(dist[2].toLowerCase()==='mi'?1.609344:1)).toFixed(2);found.push('distance')}const tm=t.match(/elapsed\s*time\s*[:\-]?\s*(\d{1,3}:\d{2}(?::\d{2})?)/i)||t.match(/total\s*time\s*[:\-]?\s*(\d{1,3}:\d{2}(?::\d{2})?)/i)||t.match(/(?:^|\n)\s*time\s*[:\-]?\s*(\d{1,3}:\d{2}(?::\d{2})?)/i);if(tm){const parts=tm[1].split(':').map(Number);if(parts.slice(1).every(v=>v<60)){$('duration').value=parts.length===3?(parts[0]*60+parts[1])+':'+String(parts[2]).padStart(2,'0'):tm[1];found.push('duration')}}const h=t.match(/(?:avg\.?\s*(?:hr|heart\s*rate)|average\s*heart\s*rate)\s*[:\-]?\s*(\d{2,3})/i);if(h){$('hr').value=h[1];found.push('average HR')}$('parse-report').textContent=`Parsed: ${found.join(', ')||'no supported fields'}. Confirm every value below. Date, activity type and time in Zone 3 require your review. A screenshot alone has not been read.`;toast('Draft only. Check each value before saving.')}
function history(){const logs=[...S.logs].sort((a,b)=>b.date.localeCompare(a.date));return `<section class="card">${logs.length?logs.map(l=>`<div class="history"><div class="quest-icon" style="width:40px;height:40px;border-radius:12px">${ico(l.kind==='run'?'run':l.kind==='recovery'?'moon':'train')}</div><div style="flex:1"><h3>${esc(l.title)}</h3><p>${dateLabel(l.date)} · ${l.kind==='recovery'?'Recovery':Math.round(l.minutes)+' min'}${l.distance?' · '+l.distance+' km · '+paceText(l.pace)+'/km':''}${l.sets?' · '+l.sets.length+' sets':''}</p><button class="link" onclick="logDetail('${l.id}')">View details</button></div><button class="iconbtn" aria-label="Delete ${esc(l.title)}" onclick="deleteLog('${l.id}')">${ico('trash')}</button></div>`).join(''):`<div class="empty">${ico('book')}<h3>Your story starts here.</h3><p>No workouts logged yet. Your numbers will stay empty until you record real results.</p><button class="btn secondary" style="margin-top:18px" onclick="logTab='quick';go('log')">Log your first session</button></div>`}</section>`}
function logDetail(id){const l=S.logs.find(x=>x.id===id);if(!l)return;modal(l.title,`<span class="badge">${esc(l.date)} · ${esc(l.kind)}</span><p style="margin:15px 0">${Math.round(l.minutes||0)} min${l.distance?` · ${l.distance} km · ${paceText(l.pace)}/km`:''}</p>${l.sets?l.sets.map(s=>`<div class="progress-row"><h3>${esc(E[s.id]?.name||s.id)}</h3><p>${esc(s.variation)} · ${s.weight} kg ${E[s.id]?.bar?'total':'added'} · ${s.reps} ${E[s.id]?.unit||'reps'} · ${s.rir??'unknown'} RIR</p></div>`).join(''):''}${l.kind==='run'?`<div class="note">Average HR: ${l.hr??'not recorded'} · Zone 3: ${l.zonePct??'unknown'}${l.zonePct!==null?'%':''}<br>Continuous: ${l.continuous?'yes':'not confirmed'}<br>Conditions: ${esc(l.conditions||'not recorded')}</div>`:''}<p style="white-space:pre-wrap;margin-top:16px">${esc(l.details||'')}${l.details?'\n':''}${esc(l.notes||'')}</p>${l.image?`<img class="screenimage" src="${l.image}" alt="Saved Garmin screenshot">`:''}`)}
function deleteLog(id){if(!confirm('Delete this log? Its benchmark and XP contribution will also be removed.'))return;S.logs=S.logs.filter(l=>l.id!==id);persist();render();toast('Log deleted.')}
function progress(){return heading('Chapter 01 / Player stats','You vs. your starting point.','Game levels reward consistency. Performance comes from measured results.')+`<div class="tabs">${[['stats','Your baseline'],['goals','Goals'],['history','History']].map(([k,n])=>`<button class="${progressTab===k?'on':''}" onclick="progressTab='${k}';render()">${n}</button>`).join('')}</div>${progressTab==='history'?history():progressTab==='goals'?goals():stats()}`}
function stats(){return `<div class="grid"><section class="card"><div class="row between"><h3>Level ${level()} · ${rank()} rank</h3><span class="badge">CONSISTENCY</span></div><div class="goalstat">${xp()} <small>total XP</small></div><div class="meter"><span style="width:${xp()%300/3}%"></span></div><p class="tagline">100 XP per training day, 30 per recovery-only day. Daily cap: 100. Every 300 XP is a level. Extra sets and workouts on the same day earn no extra XP. Rest days and missed days never remove XP.</p><details style="margin-top:12px"><summary class="small muted">How ranks work</summary><p class="tagline">E: levels 1–4 · D: 5–9 · C: 10–19 · B: 20–34 · A: 35–49 · S: 50+. These are game milestones, not medical or athletic standards.</p></details></section><section class="card"><h3>Where you are now</h3><div class="goalstat">${benchmarkCoverage()} / 8 <small>patterns measured</small></div><p class="small">${benchmarkCoverage()<8?'Complete missing assessments before judging where you are weakest. One exercise does not isolate one muscle.':'Your baseline is recorded. Next: repeat the plan, then retest in 4–6 weeks using the same setup.'}</p><button class="link" onclick="trainingTab='assess';go('train')">Open assessment →</button></section></div><div class="section-head"><h2>Strength & control</h2><span class="small muted">Personal comparisons</span></div><section class="card">${['push','row','press','squat','hinge','core','calf'].map(id=>statRow(id)).join('')}</section><div class="section-head"><h2>Aerobic baseline</h2></div><section class="card">${runStats()}</section><div class="spacer"></div><div class="note">Progress comparisons require the same exercise, variation, added load and RIR. These are self-reported working performances, not true maximums. Bodyweight change, band tension and technique can affect comparisons.</div>`}
function statRow(id){const r=records(id),tests=r.filter(s=>S.logs.find(l=>l.id===s.logId)?.benchmark),base=tests[0],last=base?[...r].reverse().find(s=>s.variation===base.variation&&Number(s.weight)===Number(base.weight)&&Number(s.rir)===Number(base.rir)):null,delta=base&&last?last.reps-base.reps:0;return `<div class="progress-row"><div class="row between"><div><h3>${E[id].pattern} <span class="muted small">/ ${E[id].muscles}</span></h3><p>${esc(E[id].name)}</p></div><span class="badge ${base?'green':''}">${base?(delta>0?'+'+delta+' '+E[id].unit:delta<0?delta+' '+E[id].unit:'BASELINE SET'):'UNMEASURED'}</span></div>${base?`<p>Baseline: <b>${base.reps} ${E[id].unit}</b> · ${base.weight} kg added · ${base.rir} RIR · ${dateLabel(base.date)}<br>Latest comparable: <b>${last.reps} ${E[id].unit}</b> · ${dateLabel(last.date)}<br>${esc(base.variation)}</p><p class="inline-tip">${delta>0?'You improved this result. Repeat it cleanly before changing the difficulty.':delta<0?'Lower result: check recovery, effort and setup. A single session does not prove you lost strength.':'Next target: repeat the result with control; then add one rep if you still have 2–3 in reserve.'}</p>`:'<p>First: record a controlled assessment set. No strength score has been assigned.</p>'}</div>`}
function runStats(){const runs=S.logs.filter(l=>l.kind==='run'&&l.benchmark==='run').sort((a,b)=>a.date.localeCompare(b.date));if(!runs.length)return `<p class="small">No 15-minute baseline recorded. Your current pace at a comfortable effort is unknown.</p><button class="link" onclick="openRun(true)">Measure your starting point →</button>`;const b=runs[0],last=runs[runs.length-1];return `<div class="row between"><h3>${paceText(last.pace)} /km</h3><span class="badge green">LATEST 15-MIN TEST</span></div><p class="tagline">${last.distance} km · ${last.hr??'—'} bpm average · effort ${last.rpe??'—'}/10<br>First baseline: ${paceText(b.pace)}/km · ${b.hr??'—'} bpm · ${dateLabel(b.date)}<br>Latest conditions: ${esc(last.conditions||'not recorded')}</p><p class="inline-tip">Compare similar terrain, temperature and perceived effort. Faster pace alone is not proof of better aerobic fitness. Build comfortable time on your feet before forcing 5:00/km.</p>`}
function runGoalStatus(l){const g=S.runGoal,lo=Number(S.p.zoneLow),hi=Number(S.p.zoneHigh);if(!lo||!hi||!S.p.zonesMethod)return false;return l.kind==='run'&&l.distance>=g.distance&&l.pace<=g.pace&&l.continuous&&l.zonePct!==null&&l.zonePct>=g.zonePct&&l.hr>=lo&&l.hr<=hi&&l.zoneLow===lo&&l.zoneHigh===hi&&l.zonesMethod===S.p.zonesMethod}
function goals(){const g=S.runGoal,validZones=Number(S.p.zoneLow)>0&&Number(S.p.zoneHigh)>Number(S.p.zoneLow)&&S.p.zonesMethod,hit=S.logs.some(runGoalStatus);return `<section class="card"><div class="row between"><span class="badge ${hit?'green':''}">${hit?'SELF-REPORTED TARGET MET':'MAIN QUEST / RUNNING'}</span>${ico('target')}</div><div class="goalstat">${paceText(g.pace)} <small>/km in your Zone 3</small></div><p class="small">${g.distance} km continuous, average pace at or faster than target, at least ${g.zonePct}% of elapsed time in configured running Zone 3. Average HR must also be within those limits.</p><div class="divider"></div><div class="row between"><p class="small">Zone 3: ${validZones?`${S.p.zoneLow}–${S.p.zoneHigh} bpm`:'not configured'}</p><button class="link" onclick="editRunGoal()">Edit goal</button></div>${!validZones?'<div class="note warn">Copy your actual running Zone 3 limits and zone method from Garmin into Profile. No age-based zone has been invented.</div>':'<p class="tagline">This result uses manually entered data. Review your Garmin time-in-zone chart. Pauses, heat, terrain and changed zone settings affect the comparison.</p>'}<button class="link" onclick="profile()">Set Garmin running zones →</button></section><div class="spacer"></div><section class="card"><span class="badge">SIDE QUEST / PHYSIQUE</span><h3 style="margin:13px 0 8px">Build visible muscle</h3><p class="small">Appearance depends on muscle size, body fat, genetics and lighting. A photo cannot give an exact body-fat percentage, and this app cannot promise a date for visible muscles.</p><div class="divider"></div><p class="small">Start with two repeatable strength sessions each week. Record reps and RIR. Review progress monthly with the same lighting and optional waist/bodyweight trends. Avoid chasing daily appearance changes.</p><button class="link" onclick="addGoal('Two strength sessions per week','sessions',2)">Add my weekly consistency goal →</button></section><div class="section-head"><h2>Your own goals</h2><button class="link" onclick="addGoal()">+ Add goal</button></div><div class="stack">${S.goals.map(goalCard).join('')||'<div class="note">Set a measurable target you control: 10 strict pull-ups, a consistent training week, or comfortable running time.</div>'}</div>`}
function goalCard(g){let current=g.weekly?new Set(weekly().filter(l=>l.kind==='strength').map(l=>l.date)).size:g.current;const percent=g.target>0?Math.min(100,current/g.target*100):0;return `<section class="card"><div class="row between"><h3>${esc(g.name)}</h3><button class="link" onclick="deleteGoal('${g.id}')">Remove</button></div><div class="goalstat">${current} / ${g.target} <small>${esc(g.unit)}${g.weekly?' this week':''}</small></div><div class="meter"><span style="width:${percent}%"></span></div>${g.weekly?'<p class="tagline">Based on logged strength days, Monday–Sunday, Dubai time.</p>':`<button class="link" onclick="updateGoal('${g.id}')">Update current result →</button>`}</section>`}
function editRunGoal(){modal('Define your running goal',`<div class="fieldrow"><div><label for="goal-pace">Pace (min:sec per km)</label><input id="goal-pace" value="${paceText(S.runGoal.pace)}" inputmode="numeric"></div><div><label for="goal-dist">Continuous distance (km)</label><input id="goal-dist" type="number" min="0.5" max="100" step="0.5" value="${S.runGoal.distance}"></div></div><label for="goal-zone">Minimum elapsed time in Zone 3 (%)</label><input id="goal-zone" type="number" min="50" max="100" value="${S.runGoal.zonePct}"><p class="tagline">90% is an editable app goal, not a clinical fitness standard. The goal is only evaluated against logs using the same recorded zone settings.</p>`,`<button class="btn full" onclick="saveRunGoal()">Save goal</button>`)}
function saveRunGoal(){const pace=parseTime($('goal-pace').value),distance=Number($('goal-dist').value),zonePct=Number($('goal-zone').value);if(!Number.isFinite(pace)||pace<120||pace>1800||distance<.5||distance>100||zonePct<50||zonePct>100)return toast('Check pace (2:00–30:00), distance (0.5–100 km) and zone percentage (50–100).');S.runGoal={pace,distance,zonePct};persist();closeModal();render()}
function addGoal(name='',unit='reps',target=''){modal('Create a measurable goal',`<label for="gname">Goal</label><input id="gname" maxlength="80" value="${esc(name)}" placeholder="10 controlled pull-ups"><div class="fieldrow"><div><label for="gtarget">Target (higher is better)</label><input id="gtarget" type="number" min="1" max="100000" step="0.1" value="${target}"></div><div><label for="gunit">Unit</label><input id="gunit" maxlength="20" value="${esc(unit)}"></div></div><label class="check"><input id="gweekly" type="checkbox" ${name?'checked':''}><span>Automatically count strength training days this week (unit: sessions).</span></label>`,`<button class="btn full" onclick="saveGoal()">Save goal</button>`)}
function saveGoal(){const name=$('gname').value.trim(),target=Number($('gtarget').value),unit=$('gunit').value.trim(),weeklyGoal=$('gweekly').checked;if(!name||!unit||target<=0||target>100000)return toast('Add a name, unit and a positive target.');S.goals.push({id:crypto.randomUUID(),name,target,unit:weeklyGoal?'sessions':unit,current:0,weekly:weeklyGoal});persist();closeModal();render()}
function updateGoal(id){const g=S.goals.find(g=>g.id===id);modal(g.name,`<label for="gcurrent">Current result (${esc(g.unit)})</label><input id="gcurrent" type="number" min="0" max="100000" step="0.1" value="${g.current}">`,`<button class="btn full" onclick="saveGoalCurrent('${id}')">Update result</button>`)}
function saveGoalCurrent(id){const n=Number($('gcurrent').value);if(!Number.isFinite(n)||n<0||n>100000)return toast('Enter a result between 0 and 100000.');S.goals.find(g=>g.id===id).current=n;persist();closeModal();render()}
function deleteGoal(id){if(!confirm('Remove this goal?'))return;S.goals=S.goals.filter(g=>g.id!==id);persist();render()}
function profile(){const p=S.p;modal('Your player profile',`<p class="small">Your equipment is already set. These details decide session length, progression and whether the starter plan is appropriate. Your fitness is still measured by results.</p><form onsubmit="event.preventDefault();saveProfile()"><label for="pname">Name</label><input id="pname" maxlength="35" value="${esc(p.name)}" required><div class="fieldrow"><div><label for="page">Age (adult plan, 18+)</label><input id="page" type="number" min="18" max="100" required value="${p.age}"></div><div><label for="pweight">Bodyweight kg (optional)</label><input id="pweight" type="number" min="30" max="300" step="0.1" value="${p.weight}"></div></div><label for="pexperience">Training experience</label><select id="pexperience">${[['unknown','Choose experience'],['new','New / form uncertain'],['returning','Returning after a break'],['regular','Regular consistent training']].map(([v,n])=>`<option value="${v}" ${p.experience===v?'selected':''}>${n}</option>`).join('')}</select><label for="ppain">Injury, pain with exercise, medical restrictions or concerning symptoms?</label><select id="ppain">${[['unknown','Choose an answer'],['no','No current concerns or restrictions'],['yes','Yes / unsure — I need guidance first']].map(([v,n])=>`<option value="${v}" ${p.pain===v?'selected':''}>${n}</option>`).join('')}</select><p class="tagline">If yes/unsure, save your profile and use the log, but do not start the assessment until a qualified professional has advised what is appropriate. This is not a medical screening tool.</p><div class="fieldrow"><div><label for="pdays">Days per week</label><select id="pdays">${[2,3,4,5].map(n=>`<option ${Number(p.days)===n?'selected':''}>${n}</option>`).join('')}</select></div><div><label for="pminutes">Session minutes</label><select id="pminutes">${[20,30,45].map(n=>`<option ${Number(p.minutes)===n?'selected':''}>${n}</option>`).join('')}</select></div></div><label for="pfocus">Main priority</label><select id="pfocus">${[['hybrid','Strength + running'],['muscle','Build muscle'],['running','Running fitness']].map(([v,n])=>`<option value="${v}" ${p.focus===v?'selected':''}>${n}</option>`).join('')}</select><div class="divider"></div><h3>Garmin running Zone 3</h3><p class="tagline">Copy the running-specific limits from Garmin Connect → your device → User Profile / Settings → Heart Rate & Power Zones. Labels vary by model. Leave unknown values blank; no max-heart-rate test is needed.</p><div class="fieldrow"><div><label for="plow">Lower limit (bpm)</label><input id="plow" type="number" min="30" max="240" value="${p.zoneLow}"></div><div><label for="phigh">Upper limit (bpm)</label><input id="phigh" type="number" min="30" max="240" value="${p.zoneHigh}"></div></div><label for="pmethod">Zone calculation method</label><select id="pmethod">${[['','Not known'],['maxHR','% maximum HR'],['HRR','% heart-rate reserve'],['LTHR','% lactate-threshold HR'],['custom','Custom bpm limits']].map(([v,n])=>`<option value="${v}" ${p.zonesMethod===v?'selected':''}>${n}</option>`).join('')}</select><button class="btn full" style="margin-top:22px" type="submit">Save profile</button></form><div class="divider"></div><div class="row wrap"><button class="link" onclick="backup()">Export / restore backup</button><button class="link" onclick="research()">Tips & research</button></div><p class="tagline">Workout Log v1 · installable web app · no account or Garmin connection. Data stays in this browser if storage is available; it is not synced or guaranteed permanent. Export regularly. To install: open the hosted app in Safari, then Share → Add to Home Screen. Open once online to cache the app for offline use.</p>`)}
function saveProfile(){const age=Number($('page').value),weight=$('pweight').value,lo=$('plow').value,hi=$('phigh').value,method=$('pmethod').value,pain=$('ppain').value,experience=$('pexperience').value;if(age<18||age>100||!Number.isInteger(age))return toast('This starter plan is for adults aged 18–100.');if(weight&&(Number(weight)<30||Number(weight)>300))return toast('Check your bodyweight.');if((lo||hi)&&(!lo||!hi||Number(lo)<30||Number(hi)>240||Number(lo)>=Number(hi)||!method))return toast('Enter both zone bounds, lower < upper, and choose the zone method.');if(!lo&&!hi&&method)return toast('Enter the Zone 3 limits or set the method to Not known.');const name=$('pname').value.trim();if(!name)return toast('Enter your name.');S.p={...S.p,name,age,weight,experience,pain,days:Number($('pdays').value),minutes:Number($('pminutes').value),focus:$('pfocus').value,zoneLow:lo,zoneHigh:hi,zonesMethod:method,ready:pain==='no'&&experience!=='unknown'};persist();closeModal();render();toast(S.p.ready?'Profile saved. Train or log now; assess whenever you want.':'Profile saved. Training waits for your safety / experience answers.')}
function research(){modal('Tips that change your training',`<div class="listgap"><div class="note"><b>Progression:</b> Keep 2–3 reps in reserve. When you can repeat the top of your rep range with control across sessions, make a small change. With your plates, add reps or choose a slightly harder bodyweight variation; don’t jump 20 kg.</div><div class="note"><b>Form:</b> Short cues are reminders, not verification. If you are unsure about barbell technique, use familiar bodyweight or band exercises and arrange an in-person check. Do not learn Olympic lifts or kipping under fatigue.</div><div class="note"><b>Running:</b> Start with comfortable run/walk time. If recovered and effort stays comfortable, add a few minutes to one session; change one training variable at a time. There is no universal safe percentage increase. Use the talk test, not a forced pace. Slow down in heat or move indoors.</div><div class="note"><b>Muscle:</b> Train major muscle groups at least twice weekly. Start with manageable volume; higher weekly volume can help muscle growth once you tolerate it. Failure is not required. A simple plan repeated beats constantly changing exercises.</div><div class="note"><b>Fuel:</b> For healthy exercising adults, ISSN suggests roughly 1.4–2.0 g protein/kg/day.${S.p.weight?` At your entered ${S.p.weight} kg, that is about ${Math.round(S.p.weight*1.4)}–${Math.round(S.p.weight*2)} g/day.`:''} Use ordinary meals first. Kidney disease or a prescribed diet needs individual advice. Visible muscle has no guaranteed deadline.</div><div class="note"><b>Recovery:</b> Leave at least a day between full-body strength sessions. Persistent pain, falling performance and poor recovery are reasons to reduce training and seek appropriate guidance, not earn extra XP.</div></div><div class="divider"></div><h3>Evidence & limits</h3><p class="tagline">Reviewed 28 October 2026. The starter routines, rep caps, XP thresholds and goal rules are app design choices. They are not validated fitness classifications or a coach’s examination.</p><div class="source"><a target="_blank" rel="noopener noreferrer" href="https://pubmed.ncbi.nlm.nih.gov/41843416/">ACSM 2026 resistance-training position stand ↗</a><a target="_blank" rel="noopener noreferrer" href="https://support.garmin.com/en-IE/?faq=w8qlOr7BQ16Z82HVrevpw9">Garmin: understanding and customizing zones ↗</a><a target="_blank" rel="noopener noreferrer" href="https://www.cdc.gov/physical-activity-basics/measuring/">CDC: relative intensity and the talk test ↗</a><a target="_blank" rel="noopener noreferrer" href="https://doi.org/10.1186/s12970-017-0177-8">ISSN: protein and exercise position stand ↗</a><a target="_blank" rel="noopener noreferrer" href="https://developer.garmin.com/gc-developer-program/activity-api/">Garmin Activity API: approval and integration requirements ↗</a></div><p class="tagline">Available here: logging, templates, submaximal assessments, goals and browser backups. Not connected: automatic image OCR, Garmin sync, cloud accounts, an App Store build, or camera-based form checks.</p>`)}
function backup(){modal('Keep a copy of your progress',`<p class="small">Export includes your profile, logs, saved screenshots and goals. Keep it private. Browser storage can be cleared; this backup is your recovery option.</p><label for="backup-data">Backup JSON</label><textarea id="backup-data" style="min-height:160px" readonly>${esc(JSON.stringify(S))}</textarea><div class="row wrap" style="margin-top:12px"><button class="btn secondary" onclick="downloadBackup()">Download JSON</button><button class="btn ghost" onclick="copyBackup()">Copy JSON</button></div><div class="divider"></div><label for="restore-file">Restore from an Workout Log backup</label><input id="restore-file" type="file" accept="application/json,.json" onchange="restoreFile(this.files[0])"><p class="tagline">Restore replaces this browser’s current data after confirmation. It does not merge.</p>`)}
function downloadBackup(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='workout-log-backup-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('If downloads are blocked, use Copy JSON.')}
async function copyBackup(){try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Backup copied. Paste it somewhere private.')}catch{$('backup-data').focus();$('backup-data').select();toast('Select and copy the JSON text above.')}}
function validateBackup(x){
 const num=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;
 const numeric=(v,min,max)=>v===''||(typeof v==='number'||typeof v==='string')&&String(v).trim()!==''&&Number.isFinite(Number(v))&&Number(v)>=min&&Number(v)<=max;
 const str=(v,max=2000)=>typeof v==='string'&&v.length<=max;
 const uid=v=>typeof v==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
 const set=(v,draft=false)=>v&&Object.hasOwn(E,v.id)&&str(v.variation,160)&&numeric(v.weight,0,500)&&numeric(v.reps,1,999)&&numeric(v.rir,0,10)&&typeof v.done==='boolean'&&(draft||num(v.weight,0,500)&&num(v.reps,1,999)&&num(v.rir,0,10));
 if(!x||x.version!==1||!x.p)return false;
 const p=x.p;
 if(!str(p.name,35)||!numeric(p.age,18,100)||!numeric(p.weight,30,300)||![2,3,4,5].includes(p.days)||![20,30,45].includes(p.minutes)||!['hybrid','running','muscle'].includes(p.focus)||!['unknown','new','returning','regular'].includes(p.experience)||!['unknown','no','yes'].includes(p.pain)||!['','maxHR','HRR','LTHR','custom'].includes(p.zonesMethod)||!numeric(p.zoneLow,30,240)||!numeric(p.zoneHigh,30,240)||typeof p.ready!=='boolean')return false;
 if(!['logs','custom','goals'].every(k=>Array.isArray(x[k])&&x[k].length<=3000))return false;
 if(!x.logs.every(l=>l&&uid(l.id)&&validDate(l.date)&&['run','strength','conditioning','walk','recovery'].includes(l.kind)&&str(l.title,100)&&num(l.minutes,0,600)&&(!l.notes||str(l.notes))&&(!l.details||str(l.details))&&(!l.image||typeof l.image==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(l.image))&&(!l.sets||Array.isArray(l.sets)&&l.sets.length<=1000&&l.sets.every(s=>set(s)))&&(l.kind!=='run'||num(l.distance,.001,300)&&num(l.pace,1,36000)&&num(l.seconds,30,36000)&&(l.hr===null||num(l.hr,30,240))&&(l.zonePct===null||num(l.zonePct,0,100))&&(l.rpe===null||num(l.rpe,1,10))&&typeof l.continuous==='boolean'&&str(l.conditions,160)&&(l.zoneLow===null||num(l.zoneLow,30,240))&&(l.zoneHigh===null||num(l.zoneHigh,30,240))&&str(l.zonesMethod,20))))return false;
 if(!x.custom.every(c=>c&&uid(c.id)&&str(c.name,60)&&Array.isArray(c.moves)&&c.moves.length>0&&c.moves.length<=500&&c.moves.every(m=>Object.hasOwn(E,m))))return false;
 if(!x.goals.every(g=>g&&uid(g.id)&&str(g.name,80)&&str(g.unit,20)&&num(g.target,.1,100000)&&num(g.current,0,100000)&&typeof g.weekly==='boolean'))return false;
 const g=x.runGoal;if(!g||!num(g.pace,120,1800)||!num(g.distance,.5,100)||!num(g.zonePct,50,100))return false;
 const a=x.active;if(a&&(!uid(a.id)||!str(a.title,100)||!num(a.start,0,1e15)||!validDate(a.date)||!str(a.notes,1000)||!Array.isArray(a.sets)||!a.sets.length||a.sets.length>1000||!a.sets.every(s=>set(s,true))))return false;
 return true;
}
async function restoreFile(f){if(!f)return;if(f.size>30000000)return toast('Backup is too large (limit 30 MB).');try{const data=JSON.parse(await f.text());if(!validateBackup(data))throw Error('Invalid');if(!confirm('Replace all current Workout Log data with this backup? Export your current data first if needed.'))return;S={...fresh(),...data,p:{...fresh().p,...data.p}};photoData='';persist();closeModal();render();toast('Backup restored.')}catch{toast('That is not a supported Workout Log backup. Nothing was replaced.')}}
persist();render();

</script><script src="./upgrade.js"></script></body></html>
